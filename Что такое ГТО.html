<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Викторина ГТО</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', Arial, sans-serif;
    background: linear-gradient(135deg, #FFE5B4, #FFC97A);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }
  .game {
    max-width: 850px;
    width: 100%;
    background: #FFF8E7;
    border-radius: 25px;
    padding: 20px;
    border: 5px solid #D4A574;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    position: relative;
  }

  /* 👇👇👇 ВАША КАРТИНКА ПО ССЫЛКЕ 👇👇👇 */
  .heroes-banner {
    width: 100%;
    height: 200px;
    border-radius: 15px;
    margin-bottom: 15px;
    border: 3px dashed #D4A574;
    overflow: hidden;
    background-color: #E8F4F8;
    background-image: url('https://storage.myseldon.com/news-pict-b6/B60D5B21226437FB215F1D0D55733ADB');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
  }
  /* Запасные смайлики, если картинка не загрузится */
  .heroes-banner .fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    letter-spacing: 12px;
    color: #8B6F47;
    background: linear-gradient(180deg, #B8E0F0, #E8F4F8);
    z-index: -1;
  }

  h1 {
    text-align: center;
    color: #B8451F;
    font-size: 26px;
    margin: 5px 0 12px;
    text-shadow: 2px 2px 0 #FFD59E;
  }

  .stats {
    display: flex;
    justify-content: space-around;
    background: linear-gradient(135deg, #B8451F, #E3663A);
    color: white;
    padding: 12px;
    border-radius: 18px;
    margin-bottom: 15px;
    box-shadow: 0 5px 0 #8B3214;
  }
  .stat { text-align: center; }
  .stat-value { font-size: 24px; font-weight: bold; }
  .stat-label { font-size: 12px; opacity: 0.9; }

  .scene {
    background: linear-gradient(180deg, #B8E0F0 0%, #E8F4F8 60%, #C4E5B8 60%, #A8D89C 100%);
    border-radius: 20px;
    padding: 25px 20px;
    min-height: 380px;
    text-align: center;
    position: relative;
    border: 3px dashed #4CAF50;
    overflow: hidden;
  }

  .progress-bar {
    width: 100%;
    height: 12px;
    background: rgba(255,255,255,0.7);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4CAF50, #8BC34A);
    width: 0%;
    transition: width 0.5s ease;
    border-radius: 10px;
  }

  .question-num {
    font-size: 14px;
    color: #6B4423;
    margin-bottom: 6px;
    font-weight: bold;
  }

  .question {
    font-size: 20px;
    color: #B8451F;
    font-weight: bold;
    background: rgba(255,255,255,0.85);
    padding: 15px 20px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .answers {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    max-width: 500px;
    margin: 0 auto;
  }

  .answer-btn {
    background: white;
    border: 3px solid #FFB74D;
    color: #4A3520;
    padding: 14px 20px;
    border-radius: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 0 #E65100;
  }
  .answer-btn:hover:not(:disabled) {
    background: #FFF3E0;
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #E65100;
  }
  .answer-btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #E65100;
  }
  .answer-btn .letter {
    background: #FF9800;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .answer-btn.correct {
    background: #C8E6C9;
    border-color: #4CAF50;
    box-shadow: 0 4px 0 #2E7D32;
    animation: pulse 0.5s ease;
  }
  .answer-btn.correct .letter { background: #4CAF50; }
  .answer-btn.wrong {
    background: #FFCDD2;
    border-color: #F44336;
    box-shadow: 0 4px 0 #B71C1C;
    animation: shake 0.4s ease;
  }
  .answer-btn.wrong .letter { background: #F44336; }
  .answer-btn:disabled { cursor: not-allowed; opacity: 0.9; }

  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .popup {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 44px;
    color: #FFD700;
    font-weight: bold;
    text-shadow: 3px 3px 0 #B8451F;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }
  .popup.show { animation: fly 1.2s ease forwards; }
  @keyframes fly {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -40px) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, -90px) scale(1); }
  }

  .final { display: none; }
  .final.show { display: block; }
  .medal { font-size: 110px; animation: spin 2s ease infinite; display: inline-block; }
  @keyframes spin {
    0%,100% { transform: rotateY(0) scale(1); }
    50% { transform: rotateY(180deg) scale(1.1); }
  }
  .final-title { font-size: 28px; font-weight: bold; margin: 10px 0; }
  .final-text { font-size: 16px; color: #4A3520; margin-bottom: 20px; }

  button.restart {
    background: linear-gradient(135deg, #4CAF50, #388E3C);
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 0 #1B5E20;
    font-family: inherit;
  }

  .sound-toggle {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255,255,255,0.9);
    border: 2px solid #D4A574;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sound-toggle:hover { background: #FFF3E0; }

  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    top: -20px;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 6;
  }
  @keyframes fall {
    to { transform: translateY(600px) rotate(720deg); }
  }

  @media (max-width: 500px) {
    h1 { font-size: 20px; }
    .question { font-size: 17px; }
    .answer-btn { font-size: 14px; padding: 12px 15px; }
  }
</style>
</head>
<body>
<div class="game">

  <button class="sound-toggle" id="soundBtn" title="Включить/выключить звук" onclick="toggleSound()">🔊</button>

  <!-- 👇 КАРТИНКА ПО ССЫЛКЕ 👇 -->
  <div class="heroes-banner">
    <div class="fallback">🐰 🐆 🐻 🦊 🐺</div>
  </div>

  <h1>🏆 Викторина «Первые шаги к ГТО» 🏆</h1>

  <div class="stats">
    <div class="stat"><div class="stat-value" id="score">0</div><div class="stat-label">Баллы</div></div>
    <div class="stat"><div class="stat-value" id="qNum">1/10</div><div class="stat-label">Вопрос</div></div>
    <div class="stat"><div class="stat-value" id="correctCount">0</div><div class="stat-label">Верно</div></div>
  </div>

  <div class="scene" id="scene">
    <div class="popup" id="popup">+10</div>

    <div id="playArea">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div class="question-num" id="questionNum">Вопрос 1 из 10</div>
      <div class="question" id="question">Загрузка...</div>
      <div class="answers" id="answers"></div>
    </div>

    <div class="final" id="finalScreen">
      <div class="medal" id="medalIcon">🥇</div>
      <div class="final-title" id="finalTitle"></div>
      <div class="final-text" id="finalText"></div>
      <button class="restart" onclick="restartGame()">🔄 Играть снова</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ВОПРОСЫ
   ВАЖНО: в voice аббревиатура пишется через ДЕФИСЫ —
   "гэ-тэ-о". Так голос читает чётко, без редукции "а".
============================================================ */
const questions = [
  {
    q: "Что означает аббревиатура ГТО?",
    answers: [
      "Готов к Труду и Обороне",
      "Главный Турнир Олимпиады",
      "Гибкость, Точность, Отвага"
    ],
    correct: 0,
    voice: "Что означает аббревиатура гэ-тэ-о?"
  },
  {
    q: "Сколько ступеней в современном комплексе ГТО?",
    answers: [
      "5 ступеней",
      "18 ступеней",
      "10 ступеней"
    ],
    correct: 1,
    voice: "Сколько ступеней в современном комплексе гэ-тэ-о?"
  },
  {
    q: "Что получает участник, успешно сдавший все нормативы ГТО?",
    answers: [
      "Медаль",
      "Значок ГТО",
      "Кубок"
    ],
    correct: 1,
    voice: "Что получает участник, успешно сдавший все нормативы гэ-тэ-о?"
  },
  {
    q: "Какого цвета значка ГТО НЕ существует?",
    answers: [
      "Золотого",
      "Серебряного",
      "Зелёного"
    ],
    correct: 2,
    voice: "Какого цвета значка гэ-тэ-о не существует?"
  },
  {
    q: "Какое испытание относится к ГТО?",
    answers: [
      "Бег на 30 метров",
      "Игра в шахматы",
      "Рисование"
    ],
    correct: 0,
    voice: "Какое испытание относится к гэ-тэ-о?"
  },
  {
    q: "Что нужно сделать перед выполнением нормативов ГТО?",
    answers: [
      "Покушать",
      "Размяться",
      "Поспать"
    ],
    correct: 1,
    voice: "Что нужно сделать перед выполнением нормативов гэ-тэ-о?"
  },
  {
    q: "Какое качество развивает наклон вперёд?",
    answers: [
      "Сила",
      "Гибкость",
      "Скорость"
    ],
    correct: 1,
    voice: "Какое качество развивает наклон вперёд?"
  },
  {
    q: "Что такое «челночный бег»?",
    answers: [
      "Бег с остановками и поворотами",
      "Бег по кругу",
      "Бег на месте"
    ],
    correct: 0,
    voice: "Что такое челночный бег?"
  },
  {
    q: "Сколько попыток обычно даётся на выполнение норматива?",
    answers: [
      "Одна",
      "Две-три",
      "Сто"
    ],
    correct: 1,
    voice: "Сколько попыток обычно даётся на выполнение норматива?"
  },
  {
    q: "Кто может сдавать нормы ГТО?",
    answers: [
      "Только взрослые",
      "Только военные",
      "Дети и взрослые с 6 лет"
    ],
    correct: 2,
    voice: "Кто может сдавать нормы гэ-тэ-о?"
  }
];

const POINTS_PER_CORRECT = 10;
let currentIdx = 0;
let score = 0;
let correctCount = 0;
let answered = false;
let soundOn = true;
let audioCtx = null;
let musicNodes = null;

/* ============================================================
   ЖЕНСКИЙ ГОЛОС
============================================================ */
let femaleVoice = null;
let speaking = false;

function pickFemaleVoice() {
  const voices = speechSynthesis.getVoices();
  // Список предпочтительных женских русских голосов
  const preferredNames = [
    'Google русский',
    'Microsoft Irina',
    'Microsoft Svetlana',
    'Milena',
    'Алиса',
    'Alice',
    'Elena',
    'Anna'
  ];
  // Мужские голоса — исключаем
  const maleNames = ['yuri', 'pavel', 'dmitri', 'maxim', 'artem', 'aleksandr', 'male'];

  for (const name of preferredNames) {
    const v = voices.find(x =>
      x.name.toLowerCase().includes(name.toLowerCase()) &&
      /ru/i.test(x.lang) &&
      !maleNames.some(m => x.name.toLowerCase().includes(m))
    );
    if (v) return v;
  }

  // Любой русский НЕ мужской
  const ruFemale = voices.find(v =>
    /ru/i.test(v.lang) && !maleNames.some(m => v.name.toLowerCase().includes(m))
  );
  if (ruFemale) return ruFemale;

  // Любой русский
  const ru = voices.find(v => /ru/i.test(v.lang));
  return ru || voices[0] || null;
}

if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => { femaleVoice = pickFemaleVoice(); };
  femaleVoice = pickFemaleVoice();
}

/* ============================================================
   ОЗВУЧКА С ГАРАНТИЕЙ ОКОНЧАНИЯ
   speak(text, callback) — вызывает callback, когда речь закончена.
============================================================ */
function speak(text, onEnd) {
  if (!soundOn || !('speechSynthesis' in window)) {
    if (onEnd) onEnd();
    return;
  }
  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  if (femaleVoice) u.voice = femaleVoice;
  u.rate = 0.85;    // медленнее — дети лучше понимают
  u.pitch = 1.5;    // выше — женственнее
  u.volume = 1.0;

  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    speaking = false;
    if (onEnd) onEnd();
  };

  u.onend = finish;
  u.onerror = finish;

  speaking = true;
  speechSynthesis.speak(u);

  // Резервный таймер на случай, если onend не сработает
  // (примерная оценка: 100 мс на символ + запас 1.5 с)
  const fallbackMs = Math.max(3000, text.length * 110 + 1500);
  setTimeout(finish, fallbackMs);
}

/* ============================================================
   ВЕСЁЛАЯ МУЗЫКА — БЫСТРАЯ ПОЛЬКА С БАРАБАНАМИ
============================================================ */
function startMusic() {
  if (!soundOn) return;
  if (musicNodes) return;

  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const master = audioCtx.createGain();
  master.gain.value = 0.09;
  master.connect(audioCtx.destination);

  const beat = 0.22; // быстро — 0.22 с на долю (≈136 BPM)

  // ---- Мелодия: быстрая, мажорная, "скачущая" ----
  const melody = [
    // Фраза 1
    [783.99, 0.5], [880.00, 0.5], [1046.50, 0.5], [880.00, 0.5],
    [783.99, 0.5], [698.46, 0.5], [783.99, 0.5], [880.00, 0.5],
    // Фраза 2
    [659.25, 0.5], [783.99, 0.5], [880.00, 0.5], [783.99, 0.5],
    [698.46, 0.5], [659.25, 0.5], [587.33, 0.5], [659.25, 0.5],
    // Фраза 3 (выше)
    [880.00, 0.5], [1046.50, 0.5], [1174.66, 0.5], [1046.50, 0.5],
    [987.77, 0.5], [880.00, 0.5], [783.99, 0.5], [880.00, 0.5],
    // Фраза 4 (финал — вниз)
    [1046.50, 0.25], [987.77, 0.25], [880.00, 0.25], [783.99, 0.25],
    [698.46, 0.5], [659.25, 0.5], [587.33, 1.0], [523.25, 1.0]
  ];

  // ---- Бас-прыгунок ----
  const bassLine = [
    130.81, 174.61, 130.81, 174.61,
    146.83, 196.00, 146.83, 196.00,
    130.81, 174.61, 130.81, 174.61,
    146.83, 196.00, 174.61, 130.81,
    174.61, 220.00, 174.61, 220.00,
    196.00, 246.94, 196.00, 246.94,
    174.61, 220.00, 174.61, 220.00,
    196.00, 174.61, 130.81, 174.61
  ];

  const melodyTotal = melody.reduce((s, n) => s + n[1] * beat, 0);

  function scheduleLoop() {
    const startT = audioCtx.currentTime + 0.06;

    // Мелодия — triangle, звонкая
    let t = startT;
    melody.forEach(([freq, dur]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const durSec = dur * beat;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.7, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t + durSec * 0.85);
      osc.connect(gain); gain.connect(master);
      osc.start(t); osc.stop(t + durSec);
      t += durSec;
    });

    // Бас — square, короткие ноты
    let tb = startT;
    bassLine.forEach(freq => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, tb);
      gain.gain.linearRampToValueAtTime(0.28, tb + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, tb + beat * 0.6);
      osc.connect(gain); gain.connect(master);
      osc.start(tb); osc.stop(tb + beat);
      tb += beat;
    });

    // Барабаны — бочка на 1 и 3, хэт на каждой доле
    let td = startT;
    for (let i = 0; i < bassLine.length; i++) {
      // Бочка (низкий шумовой удар)
      if (i % 4 === 0 || i % 4 === 2) {
        const kick = audioCtx.createOscillator();
        const kickGain = audioCtx.createGain();
        kick.type = 'sine';
        kick.frequency.setValueAtTime(150, td);
        kick.frequency.exponentialRampToValueAtTime(50, td + 0.1);
        kickGain.gain.setValueAtTime(0.6, td);
        kickGain.gain.exponentialRampToValueAtTime(0.001, td + 0.15);
        kick.connect(kickGain); kickGain.connect(master);
        kick.start(td); kick.stop(td + 0.16);
      }

      // Хэт (короткий щелчок) на каждой доле
      const hat = audioCtx.createOscillator();
      const hatGain = audioCtx.createGain();
      hat.type = 'square';
      hat.frequency.value = 8000;
      hatGain.gain.setValueAtTime(0.06, td);
      hatGain.gain.exponentialRampToValueAtTime(0.001, td + 0.04);
      hat.connect(hatGain); hatGain.connect(master);
      hat.start(td); hat.stop(td + 0.05);

      td += beat;
    }
  }

  scheduleLoop();
  musicNodes = {
    master,
    interval: setInterval(scheduleLoop, melodyTotal * 1000)
  };
}

function stopMusic() {
  if (musicNodes) {
    clearInterval(musicNodes.interval);
    if (musicNodes.master) { try { musicNodes.master.disconnect(); } catch(e){} }
    musicNodes = null;
  }
  if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; }
}

/* ============================================================
   КОРОТКИЕ СИГНАЛЫ
============================================================ */
function playTone(freq, duration, type) {
  if (!soundOn) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
function playCorrectSound() {
  playTone(659, 0.12);
  setTimeout(() => playTone(784, 0.12), 120);
  setTimeout(() => playTone(1046, 0.25), 240);
}
function playWrongSound() {
  playTone(220, 0.2, 'sawtooth');
  setTimeout(() => playTone(165, 0.3, 'sawtooth'), 180);
}

/* ============================================================
   ИГРОВАЯ ЛОГИКА
============================================================ */
function updateStats() {
  document.getElementById('score').textContent = score;
  document.getElementById('qNum').textContent = (currentIdx + 1) + '/' + questions.length;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('progress').style.width = ((currentIdx) / questions.length * 100) + '%';
}

function showPopup(text, color) {
  const p = document.getElementById('popup');
  p.textContent = text;
  p.style.color = color || '#FFD700';
  p.classList.remove('show');
  void p.offsetWidth;
  p.classList.add('show');
}

function loadQuestion() {
  const q = questions[currentIdx];
  answered = false;
  document.getElementById('questionNum').textContent = 'Вопрос ' + (currentIdx + 1) + ' из ' + questions.length;
  document.getElementById('question').textContent = q.q;

  const answersEl = document.getElementById('answers');
  answersEl.innerHTML = '';
  const letters = ['А', 'Б', 'В'];

  q.answers.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = '<span class="letter">' + letters[i] + '</span><span>' + ans + '</span>';
    btn.onclick = () => selectAnswer(i, btn);
    answersEl.appendChild(btn);
  });

  // Озвучиваем вопрос, но НЕ ждём — играем сразу
  setTimeout(() => speak(q.voice || q.q), 250);
  updateStats();
}

function selectAnswer(i, btn) {
  if (answered) return;
  answered = true;
  const q = questions[currentIdx];
  const buttons = document.querySelectorAll('.answer-btn');
  buttons.forEach(b => b.disabled = true);

  if (i === q.correct) {
    btn.classList.add('correct');
    score += POINTS_PER_CORRECT;
    correctCount++;
    showPopup('+' + POINTS_PER_CORRECT, '#4CAF50');
    playCorrectSound();
    setTimeout(() => {
      speak('Правильно! Молодец!', () => goToNext());
    }, 300);
  } else {
    btn.classList.add('wrong');
    buttons[q.correct].classList.add('correct');
    showPopup('Ой!', '#F44336');
    playWrongSound();
    const correctText = q.answers[q.correct]
      .replace(/ГТО/g, 'гэ-тэ-о')  // защита на случай "ГТО" в ответе
      .replace(/ГТА/g, 'гэ-тэ-о');
    setTimeout(() => {
      speak('Не угадал. Правильный ответ — ' + correctText, () => goToNext());
    }, 300);
  }

  updateStats();
}

/* ============================================================
   ПЕРЕХОД К СЛЕДУЮЩЕМУ ВОПРОСУ
   Вызывается ТОЛЬКО когда голос закончил говорить.
============================================================ */
function goToNext() {
  currentIdx++;
  if (currentIdx >= questions.length) showFinal();
  else loadQuestion();
}

function showFinal() {
  document.getElementById('playArea').style.display = 'none';
  document.getElementById('finalScreen').classList.add('show');
  document.getElementById('progress').style.width = '100%';

  const total = questions.length * POINTS_PER_CORRECT;
  const percent = (score / total) * 100;

  let medal, title, text, color, voice;
  if (percent >= 90) {
    medal='🥇'; title='Золотой значок ГТО!'; color='#FFD700';
    text='Великолепно! Ты отлично знаешь ГТО! Настоящий чемпион!';
    voice='Поздравляю! Ты получаешь золотой значок гэ-тэ-о! Великолепно!';
  } else if (percent >= 60) {
    medal='🥈'; title='Серебряный значок ГТО!'; color='#A0A0A0';
    text='Хороший результат! Ты многое знаешь о ГТО!';
    voice='Молодец! Ты получаешь серебряный значок гэ-тэ-о!';
  } else {
    medal='🥉'; title='Бронзовый значок ГТО!'; color='#CD7F32';
    text='Неплохо для начала! Попробуй ещё раз — будет ещё лучше!';
    voice='Молодец! Ты получаешь бронзовый значок гэ-тэ-о! Попробуй ещё раз!';
  }

  document.getElementById('medalIcon').textContent = medal;
  document.getElementById('finalTitle').textContent = title;
  document.getElementById('finalTitle').style.color = color;
  document.getElementById('finalText').innerHTML = text + '<br><br><b>Правильных ответов: ' + correctCount + ' из ' + questions.length + '</b><br><b>Баллов: ' + score + ' из ' + total + '</b>';

  setTimeout(() => speak(voice), 400);
  createConfetti();
}

function createConfetti() {
  const scene = document.getElementById('scene');
  const colors = ['#FFD700','#FF6B6B','#4ECDC4','#95E1D3','#F38181','#AA96DA','#FFB74D'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * 1.5) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    scene.appendChild(c);
  }
}

function restartGame() {
  currentIdx = 0; score = 0; correctCount = 0; answered = false;
  document.getElementById('playArea').style.display = 'block';
  document.getElementById('finalScreen').classList.remove('show');
  document.querySelectorAll('.confetti').forEach(c => c.remove());
  loadQuestion();
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) {
    startMusic();
    speak('Звук включён');
  } else {
    speechSynthesis.cancel();
    stopMusic();
  }
}

window.addEventListener('load', () => {
  setTimeout(() => { femaleVoice = pickFemaleVoice(); }, 500);

  const startOnFirstClick = () => {
    if (soundOn) startMusic();
    document.removeEventListener('click', startOnFirstClick);
  };
  document.addEventListener('click', startOnFirstClick);

  loadQuestion();
});
</script>
