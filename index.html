<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ГТО — Путь к значку</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#3E9C4E;--gd:#1E6A2E;--gold:#FFD23F;--goldd:#E0A800;--ink:#1E3A28;--soft:#5A7058;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif;color:var(--ink);user-select:none;}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;}
svg{display:block;max-width:100%;}
#app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
 background:linear-gradient(180deg,#B8E8FF 0%,#D9F0E0 55%,#FFF5C8 100%);}
#hud{display:flex;align-items:center;gap:8px;padding:8px 14px;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(220,245,225,.92));
 border-bottom:4px solid var(--gd);border-radius:0 0 22px 22px;box-shadow:0 6px 0 rgba(30,106,46,.3);z-index:10;}
.logo{display:flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-weight:900;font-size:clamp(11px,1.9vh,17px);color:var(--gd);white-space:nowrap;}
.logo-mark{width:clamp(30px,4.5vh,40px);height:clamp(30px,4.5vh,40px);}
.tokens{margin-left:auto;display:flex;align-items:center;gap:5px;padding:5px 14px;background:linear-gradient(180deg,#FFE9A0,#FFC850);
 border:3px solid var(--goldd);border-radius:18px;font-size:clamp(13px,2vh,18px);color:#5A3800;font-weight:900;box-shadow:0 4px 0 var(--goldd);}
#score{display:inline-block;min-width:1.4em;text-align:center;}
#score.pop{animation:sp .6s cubic-bezier(.2,1.6,.35,1);}
@keyframes sp{40%{transform:scale(1.8) rotate(-15deg)}}
.icon-btn{width:clamp(36px,5vh,46px);height:clamp(36px,5vh,46px);border-radius:50%;
 background:linear-gradient(180deg,#FFFDF0,#E0F0E0);border:3px solid var(--gd);font-size:clamp(16px,2.4vh,22px);
 display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--gd);}
.icon-btn:active{transform:translateY(3px);box-shadow:none;}
#screens{position:relative;flex:1;overflow:hidden;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:12px;overflow-y:auto;
 opacity:0;visibility:hidden;transform:scale(.96);transition:all .4s;}
.screen.active{opacity:1;visibility:visible;transform:scale(1);}
#scr-start.active{justify-content:center;}
.start-box{width:min(700px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
.badge-lg{width:clamp(150px,24vh,220px);animation:fl 4s ease-in-out infinite;}
@keyframes fl{50%{transform:translateY(-10px) rotate(2deg)}}
.title{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(24px,4.6vh,46px);line-height:1.05;color:var(--gd);
 text-shadow:0 2px 0 #fff,0 4px 0 var(--gold),0 8px 12px rgba(30,106,46,.4);}
.title em{font-style:normal;background:linear-gradient(180deg,#FFE9A0,#FFA03A);
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 #fff);}
.sub{font-size:clamp(12px,2vh,17px);line-height:1.5;max-width:560px;font-weight:700;background:rgba(255,255,255,.8);
 padding:12px 20px;border-radius:20px;border:3px dashed var(--g);}
.big{padding:16px 42px;border-radius:55px;background:linear-gradient(180deg,#FFE24A,#FFB03A);color:#3A2800;
 font-family:'Cinzel',serif;font-weight:900;font-size:clamp(15px,2.3vh,21px);min-height:64px;border:4px solid var(--gd);
 box-shadow:0 8px 0 var(--gd),inset 0 3px 0 rgba(255,255,255,.7);}
.big:active{transform:translateY(5px);box-shadow:0 3px 0 var(--gd);}
.map-title{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(18px,3.4vh,30px);color:var(--gd);
 text-shadow:0 2px 0 #fff,0 4px 0 var(--gold);margin-bottom:12px;text-align:center;}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:min(1000px,100%);}
.lv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
 padding:16px 12px;border-radius:22px;cursor:pointer;text-align:center;min-height:160px;border:5px solid;
 box-shadow:0 10px 0 rgba(0,0,0,.22),inset 0 4px 0 rgba(255,255,255,.6);transition:transform .2s;}
.lv:hover:not(.locked){transform:translateY(-5px);}
.lv:active:not(.locked){transform:translateY(3px);}
.lv.locked{opacity:.55;filter:grayscale(.7);cursor:not-allowed;}
.lv.l1{background:linear-gradient(180deg,#FFC8C8,#FF9090);border-color:#A82828;}
.lv.l2{background:linear-gradient(180deg,#C8E8FF,#7BB8E8);border-color:#28588A;}
.lv.l3{background:linear-gradient(180deg,#FFD9A8,#FFB060);border-color:#A05820;}
.lv.l4{background:linear-gradient(180deg,#D0F0C0,#90D880);border-color:#2E8028;}
.lv.l5{background:linear-gradient(180deg,#E0D0F8,#B8A0E0);border-color:#5A3AA8;}
.lv.l6{background:linear-gradient(180deg,#C8F0F0,#80D8D8);border-color:#1E7878;}
.lv-ic{font-size:clamp(44px,7vh,64px);line-height:1;}
.lv-nm{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(13px,2vh,19px);}
.lv-ds{font-size:clamp(10px,1.5vh,12px);color:var(--soft);font-weight:700;}
.lv.done::after{content:'⭐';position:absolute;top:6px;left:6px;width:38px;height:38px;border-radius:50%;
 background:linear-gradient(180deg,#FFE24A,#FFB03A);font-size:20px;display:flex;align-items:center;justify-content:center;
 border:3px solid var(--goldd);box-shadow:0 3px 0 var(--goldd);}
.wrap{width:min(860px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:20px;}
.head{display:flex;align-items:center;gap:10px;width:100%;justify-content:space-between;flex-wrap:wrap;}
.gtitle{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(14px,2.4vh,20px);color:var(--gd);}
.gprog{font-size:clamp(11px,1.8vh,16px);color:#5A3800;background:linear-gradient(180deg,#FFE9A0,#FFC850);
 padding:5px 14px;border-radius:16px;border:3px solid var(--goldd);box-shadow:0 4px 0 var(--goldd);font-weight:900;}
.scene{width:100%;background:linear-gradient(180deg,#FFFDF0,#F0F8E8);border:5px solid var(--gd);border-radius:26px;
 padding:18px;box-shadow:0 12px 0 var(--gd),inset 0 4px 0 rgba(255,255,255,.8);
 display:flex;flex-direction:column;gap:12px;align-items:center;}
.semoji{font-size:clamp(60px,11vh,100px);line-height:1;animation:bo 2.5s ease-in-out infinite;}
@keyframes bo{50%{transform:translateY(-10px)}}
.stxt{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(14px,2.3vh,20px);text-align:center;line-height:1.4;max-width:600px;}
.shint{font-size:clamp(11px,1.8vh,15px);color:var(--soft);font-weight:700;font-style:italic;
 background:rgba(255,255,255,.7);padding:5px 12px;border-radius:12px;}
.opts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:600px;}
.opt{display:flex;align-items:center;gap:12px;padding:14px 18px;min-height:66px;border-radius:20px;
 background:linear-gradient(180deg,#FFFFFF,#F5FBE8);border:4px solid var(--g);text-align:left;
 font-size:clamp(12px,1.9vh,17px);font-weight:900;line-height:1.3;cursor:pointer;
 box-shadow:0 6px 0 var(--g),inset 0 3px 0 rgba(255,255,255,.9);}
.opt:hover:not(.locked){transform:translateY(-2px);}
.opt:active:not(.locked){transform:translateY(3px);box-shadow:0 2px 0 var(--g);}
.opt.locked{pointer-events:none;}
.oe{font-size:clamp(28px,4.8vh,42px);flex-shrink:0;}
.ot{flex:1;}
.opt.good{background:linear-gradient(180deg,#C8FAD8,#7BE08E);border-color:#2E8A48;box-shadow:0 6px 0 #2E8A48;}
.opt.bad{background:linear-gradient(180deg,#FFD0D0,#FFA0A0);border-color:#A82828;box-shadow:0 6px 0 #A82828;}
.opt.dim{opacity:.35;}
.fb{display:none;flex-direction:column;gap:8px;padding:14px 18px;border-radius:20px;
 background:linear-gradient(135deg,#FFFDF0,#FFE9A8);border:4px solid var(--goldd);box-shadow:0 8px 0 var(--goldd);
 width:100%;max-width:600px;align-items:center;}
.fb.show{display:flex;}
.fb.good{background:linear-gradient(135deg,#E0FAE8,#B8F0C8);border-color:#2E8A48;box-shadow:0 8px 0 #2E8A48;}
.fb.bad{background:linear-gradient(135deg,#FFE8E8,#FFC8C8);border-color:#A82828;box-shadow:0 8px 0 #A82828;}
.fbe{font-size:clamp(40px,7vh,64px);}
.fbt{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(13px,2vh,18px);color:var(--gd);text-align:center;}
.fb.good .fbt{color:#1E6A38;}
.fb.bad .fbt{color:#8A1818;}
.fbx{font-size:clamp(12px,1.9vh,16px);line-height:1.5;text-align:center;font-weight:700;}
.fact{display:none;padding:12px 16px;border-radius:18px;background:linear-gradient(135deg,#E8F8F0,#C8EAD8);
 border:3px solid var(--g);width:100%;max-width:600px;}
.fact.show{display:block;animation:fi .4s;}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ftit{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(12px,1.8vh,15px);color:var(--gd);margin-bottom:5px;}
.ftxt{font-size:clamp(11px,1.7vh,14px);line-height:1.5;font-weight:700;}
.nxt{display:none;padding:12px 34px;border-radius:55px;background:linear-gradient(180deg,#B8F0C8,#4EB878);color:#fff;
 font-family:'Cinzel',serif;font-weight:900;font-size:clamp(14px,2.1vh,18px);min-height:54px;border:4px solid #1E6A38;
 box-shadow:0 8px 0 #1E6A38;align-items:center;gap:8px;margin-top:4px;}
.nxt.show{display:inline-flex;}
.nxt:active{transform:translateY(4px);box-shadow:0 3px 0 #1E6A38;}
.lfin{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
 padding:22px;background:linear-gradient(180deg,#FFFDF0,#FFE9A8);border:6px solid var(--goldd);border-radius:28px;
 box-shadow:0 14px 0 var(--goldd);}
.ffin{width:clamp(90px,15vh,140px);}
.ftit2{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(18px,3vh,26px);color:var(--gd);text-shadow:0 3px 0 #fff;}
.ftx2{font-size:clamp(12px,1.8vh,15px);line-height:1.5;max-width:480px;font-weight:700;}
.ftok{display:flex;align-items:center;gap:8px;padding:10px 22px;background:linear-gradient(180deg,#FFE9A0,#FFC850);
 border:4px solid var(--goldd);border-radius:20px;font-size:clamp(20px,3vh,28px);color:#5A3800;
 box-shadow:0 8px 0 var(--goldd);font-weight:900;}
.fwrap{width:min(660px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:14px 0;}
.fbig{width:clamp(120px,18vh,180px);animation:bs 3s ease-in-out infinite;}
@keyframes bs{50%{transform:rotate(5deg) scale(1.08)}}
.ftitle{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(20px,3.6vh,34px);color:var(--gd);
 text-shadow:0 3px 0 #fff,0 6px 0 var(--gold);}
.frank{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(16px,2.6vh,22px);}
.fsc{display:flex;align-items:center;gap:14px;padding:12px 30px;background:linear-gradient(135deg,#FFE24A,#FFB03A);
 border:5px solid var(--goldd);border-radius:24px;box-shadow:0 10px 0 var(--goldd);}
.fscn{font-size:clamp(34px,5.4vh,48px);color:#5A3800;line-height:1;font-weight:900;}
.fscl{font-size:clamp(11px,1.7vh,15px);color:#5A3800;letter-spacing:1px;text-transform:uppercase;font-weight:900;}
.fwis{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(13px,1.9vh,17px);line-height:1.55;
 max-width:540px;padding:16px 22px;border-radius:22px;background:linear-gradient(180deg,#FFFFFF,#F5FBE8);
 border:4px dashed var(--g);}
#confetti{position:fixed;inset:0;z-index:500;pointer-events:none;}
.mp{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(110px,18vh,180px);
 pointer-events:none;z-index:600;opacity:0;}
.mp.show{animation:mp 1.3s ease forwards;}
@keyframes mp{40%{opacity:1;transform:translate(-50%,-50%) scale(1.4) rotate(15deg)}
 100%{opacity:0;transform:translate(-50%,-50%) scale(1.8) rotate(20deg)}}
.sign{display:block;width:70px;height:auto;margin:8px auto 2px;opacity:.75;pointer-events:none;}
.signtxt{text-align:center;font-size:10px;color:#8A6AD0;opacity:.75;font-family:'Nunito',sans-serif;letter-spacing:.5px;}
</style>
</head>
<body>
<div id="app">
 <header id="hud">
  <div class="logo"><div class="logo-mark" id="lm"></div><span>ГТО — Путь к значку</span></div>
  <div class="tokens"><span>⭐</span><span id="score">0</span></div>
  <button class="icon-btn" id="menuBtn">🗺️</button>
  <button class="icon-btn" id="sound">🔔</button>
 </header>

 <main id="screens">
  <section class="screen active" id="scr-start">
   <div class="start-box">
    <div class="badge-lg" id="startBadge"></div>
    <h1 class="title">ГТО<br><em>Путь к значку</em></h1>
    <p class="sub">Привет, юный спортсмен! Тебя ждут 6 залов — по одному на каждое качество. Выполни испытания, собери ⭐ и получи значок ГТО!</p>
    <button class="big" id="btnStart">🏅 Начать</button>
    <div id="startAuthor"></div>
   </div>
  </section>

  <section class="screen" id="scr-map">
   <h2 class="map-title">🏟️ Спортивные залы</h2>
   <div class="levels" id="levels"></div>
  </section>

  <section class="screen" id="scr-game">
   <div class="wrap">
    <div class="head"><h2 class="gtitle" id="gTitle">Зал</h2><span class="gprog" id="gProg">1 / 3</span></div>
    <div class="scene">
     <div class="semoji" id="gEmoji">🏃</div>
     <div class="stxt" id="gText">Вопрос</div>
     <div class="shint" id="gHint"></div>
     <div id="gBody" style="width:100%;display:flex;flex-direction:column;align-items:center;"></div>
     <div class="fact" id="gFact"><div class="ftit">💡 Интересный факт</div><div class="ftxt" id="gFactText"></div></div>
     <div class="fb" id="gFb"><div class="fbe" id="gFbEmoji">🏅</div><div class="fbt" id="gFbTitle"></div><div class="fbx" id="gFbText"></div></div>
     <button class="nxt" id="btnNext">Дальше →</button>
    </div>
   </div>
  </section>

  <section class="screen" id="scr-levelend">
   <div class="lfin">
    <div class="ffin" id="lfBadge"></div>
    <div class="ftit2" id="lfTitle">Зал пройден!</div>
    <div class="ftx2" id="lfText"></div>
    <div class="ftok">⭐ <span id="lfTokens">0</span></div>
    <button class="big" id="btnBack">🏟️ К залам</button>
   </div>
  </section>

  <section class="screen" id="scr-final">
   <div class="fwrap">
    <div class="fbig" id="finalBadge"></div>
    <h2 class="ftitle">Ты получил значок ГТО!</h2>
    <div class="frank" id="fRank"></div>
    <div class="fsc"><span class="fscn" id="fScore">0</span><span class="fscl">звёзд</span></div>
    <p class="fwis" id="fWisdom"></p>
    <button class="big" id="btnRestart">🔄 Снова</button>
    <div id="finalAuthor"></div>
   </div>
  </section>
 </main>
</div>
<div class="mp" id="mp">🏅</div>
<canvas id="confetti"></canvas>

<script>
/* ЛОГОТИП АВТОРА */
const SIGN = `<svg viewBox="0 0 180 90" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C83838"/><stop offset="1" stop-color="#8A1818"/></linearGradient></defs>
<rect x="20" y="20" width="50" height="55" rx="4" fill="url(#bg)" stroke="#5A0F0F" stroke-width="2"/>
<rect x="24" y="24" width="42" height="47" rx="2" fill="#FFFBE8" stroke="#C8A878" stroke-width="1"/>
<line x1="30" y1="34" x2="60" y2="34" stroke="#C8A878" stroke-width="1.5"/>
<line x1="30" y1="42" x2="60" y2="42" stroke="#C8A878" stroke-width="1.5"/>
<line x1="30" y1="50" x2="55" y2="50" stroke="#C8A878" stroke-width="1.5"/>
<line x1="30" y1="58" x2="58" y2="58" stroke="#C8A878" stroke-width="1.5"/>
<path d="M50 20 L50 40 L55 35 L60 40 L60 20 Z" fill="#FFD23F" stroke="#E0A800" stroke-width="1"/>
<text x="115" y="50" font-family="Cinzel,serif" font-size="22" font-weight="900" text-anchor="middle" fill="#8A1818">У.Е.Б.</text>
<text x="115" y="72" font-family="Nunito,sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#C83838" letter-spacing="1.5">АВТОРСКАЯ ИГРА</text>
</svg>`;
const SIGNAUTH = SIGN + '<p class="signtxt">© Устинова Е.Б., 2025 · авторская разработка</p>';

/* ЗНАЧКИ ГТО */
function badge(lvl){
 const c = lvl==='gold' ? ['#FFE9A0','#FFC850','#8A6020','#FFFBE8']
  : lvl==='silver' ? ['#F0F0F0','#C8D0D8','#4A5460','#FFF']
  : ['#FFD9A8','#E0A060','#5A3010','#FFF8E8'];
 return `<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
 <defs><radialGradient id="bg-${lvl}" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="${c[0]}"/><stop offset=".6" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[1]}"/></radialGradient></defs>
 <ellipse cx="100" cy="228" rx="55" ry="6" fill="#000" opacity=".12"/>
 <path d="M60 10 L80 80 L100 60 L120 80 L140 10 L120 40 L100 20 L80 40 Z" fill="#C83838" stroke="#5A0F0F" stroke-width="2"/>
 <circle cx="100" cy="140" r="70" fill="url(#bg-${lvl})" stroke="${c[2]}" stroke-width="4"/>
 <circle cx="100" cy="140" r="58" fill="none" stroke="${c[2]}" stroke-width="1.5" opacity=".6"/>
 <text x="100" y="132" font-family="Cinzel,serif" font-size="30" font-weight="900" text-anchor="middle" fill="${c[2]}">ГТО</text>
 <text x="100" y="158" font-family="Nunito,sans-serif" font-size="11" font-weight="900" text-anchor="middle" fill="${c[2]}" letter-spacing="1">1 СТУПЕНЬ</text>
 <path d="M100 170 L104 184 L118 184 L107 193 L111 207 L100 198 L89 207 L93 193 L82 184 L96 184 Z" fill="${c[3]}" stroke="${c[2]}" stroke-width="1.5" stroke-linejoin="round"/>
 </svg>`;
}
const GTO_LOGO = `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
 <circle cx="30" cy="30" r="28" fill="#3E9C4E" stroke="#1E6A2E" stroke-width="2.5"/>
 <text x="30" y="38" font-family="Cinzel,serif" font-size="18" font-weight="900" text-anchor="middle" fill="#FFFBE8">ГТО</text></svg>`;

/* ФАКТЫ ДЛЯ ДЕТЕЙ */
const FACTS = {
 gto_start:'Комплексу ГТО больше 90 лет! Его придумали в 1931 году, чтобы все люди в стране были сильными и здоровыми.',
 secret:'Когда ГТО только появилось, одна английская газета написала: «У русских появилось новое секретное оружие!» — и это было ГТО!',
 first:'Самый первый значок ГТО придумал не взрослый художник, а обычный 15-летний школьник Володя Токтаров. Вот это да!',
 badges:'Значки ГТО бывают трёх цветов: бронзовый — как медь, серебряный — как луна, золотой — как солнышко. Золотой — самый главный!',
 gagar:'Юрий Гагарин — первый космонавт в мире — тоже получил свой золотой значок ГТО! Он очень любил спорт.',
 mishka:'У ГТО есть талисманы-зверята! Медведь Потап — самый сильный. Он олицетворяет силу.',
 leopard:'У ГТО есть талисманы-зверята! Леопард Вика — самая быстрая. Она олицетворяет скорость.',
 fox:'У ГТО есть талисманы-зверята! Лиса Василиса — самая гибкая. Она олицетворяет гибкость.',

/* СОСТОЯНИЕ */
const st={score:0,sound:1,voice:null,music:1,h:null,i:0,done:{},lock:0,hs:0,timer:null};

/* ГОЛОС */
const spOK='speechSynthesis' in window;
function pv(){if(!spOK)return;const vs=speechSynthesis.getVoices()||[];if(!vs.length)return;
 const ru=vs.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ru'));
 const pr=['milena','alena','dariya','svetlana','irina','katya','anna','elena','yulia','olga','google'];
 for(const n of pr){const f=ru.find(v=>(v.name||'').toLowerCase().includes(n));if(f){st.voice=f;return;}}
 st.voice=ru[0]||null;}
if(spOK){pv();speechSynthesis.onvoiceschanged=pv;}
let lastS=0;
function say(t){if(!st.sound||!spOK||!t)return;const n=Date.now();if(n-lastS<300)return;lastS=n;
 try{speechSynthesis.cancel()}catch(e){}
 const c=String(t).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();if(!c)return;
 const u=new SpeechSynthesisUtterance(c);u.lang='ru-RU';if(st.voice)u.voice=st.voice;
 u.rate=.95;u.pitch=1.12;u.volume=1;speechSynthesis.speak(u);}
function stopS(){if(spOK){try{speechSynthesis.cancel()}catch(e){}}}

/* ЗВУКИ */
let AC=null;
function ea(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
 if(AC&&AC.state==='suspended')AC.resume();}
function tn(f,s,d,t,v){if(!st.sound||!AC)return;const t0=AC.currentTime+(s||0);
 const o=AC.createOscillator();const g=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,t0);
 g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v||.14,t0+.02);
 g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);
 o.start(t0);o.stop(t0+d+.05);}
const sx={
 click:()=>tn(720,0,.07,'triangle',.1),
 good:()=>{tn(660,0,.12,'sine',.15);tn(880,.09,.18,'sine',.15);tn(1320,.2,.24,'sine',.13)},
 bad:()=>{tn(280,0,.14,'square',.1);tn(220,.14,.22,'square',.09)},
 star:()=>{tn(1400,0,.08,'triangle',.13);tn(1800,.06,.12,'triangle',.11)},
 fin:()=>[523,659,784,1047,1319].forEach((f,i)=>tn(f,i*.14,.35,'sine',.15))
};
function mus(){if(!st.sound||!st.music||!AC)return;
 const m=[392,494,587,494,392,349,392,494,587,659,587,494];
 m.forEach((f,i)=>{tn(f,i*.7,.6,'sine',.028);if(i%3===0)tn(f/2,i*.7,.8,'sine',.02)});
 st.timer=setTimeout(mus,m.length*700);}
function startM(){if(!st.timer)mus();}
function stopM(){if(st.timer){clearTimeout(st.timer);st.timer=null;}}

/* КОНФЕТТИ */
const cv=document.getElementById('confetti'),cc=cv.getContext('2d');
let pp=[],run=0;
const CL=['#FFE9A0','#FFC850','#A88BD4','#FF7A7A','#7BD8A8','#7AC8F0','#FFFBE8','#FFB0D0'];
function rc(){cv.width=innerWidth;cv.height=innerHeight}
rc();addEventListener('resize',rc);
function fire(n,ox,oy){const cx=ox??cv.width/2,cy=oy??cv.height/2;
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2.5+Math.random()*6;
  pp.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,size:6+Math.random()*8,
   color:CL[(Math.random()*CL.length)|0],life:1,dec:.008+Math.random()*.008,
   w:Math.random()*Math.PI*2,shape:Math.random()<.6?'star':'circle'});}
 if(!run){run=1;requestAnimationFrame(up)}}
function ds(ctx,s){ctx.beginPath();
 for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2-Math.PI/2;const r=i%2===0?s:s/2.2;
  if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
 ctx.closePath();ctx.fill();}
function up(){cc.clearRect(0,0,cv.width,cv.height);
 for(let i=pp.length-1;i>=0;i--){const p=pp[i];p.vy+=.08;p.w+=.18;p.x+=p.vx+Math.sin(p.w)*.6;
  p.y+=p.vy;p.vx*=.985;p.life-=p.dec;if(p.life<=0){pp.splice(i,1);continue}
  cc.globalAlpha=Math.max(0,p.life);cc.fillStyle=p.color;
  if(p.shape==='star')ds(cc,p.size);else{cc.beginPath();cc.arc(p.x,p.y,p.size,0,Math.PI*2);cc.fill()}}
 cc.globalAlpha=1;
 if(pp.length>0)requestAnimationFrame(up);else{run=0;cc.clearRect(0,0,cv.width,cv.height)}}

/* ХЕЛПЕРЫ */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');}
function addS(p){st.score=Math.max(0,st.score+p);const e=document.getElementById('score');
 e.textContent=st.score;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');}
function popM(){const e=document.getElementById('mp');e.classList.remove('show');void e.offsetWidth;e.classList.add('show');}

/* КАРТА */
function renderMap(){const b=document.getElementById('levels');b.innerHTML='';
 HALLS.forEach((h,i)=>{const un=i===0||st.done[HALLS[i-1].id];
  const e=document.createElement('button');e.className='lv '+h.cls;
  if(st.done[h.id])e.classList.add('done');if(!un)e.classList.add('locked');
  e.innerHTML='<div class="lv-ic">'+h.ic+'</div><div class="lv-nm">'+h.nm+'</div><div class="lv-ds">'+h.ds+'</div>';
  e.addEventListener('click',()=>{if(!un)return;ea();sx.click();startH(h)});
  b.appendChild(e)});}

/* СТАРТ ЗАЛА */
function startH(h){st.h=h;st.i=0;st.lock=0;st.hs=0;show('scr-game');renderT();}

/* РЕНДЕР ЗАДАНИЯ */
function renderT(){const h=st.h,q=h.q[st.i];st.lock=0;
 document.getElementById('gTitle').textContent=h.ic+' '+h.nm;
 document.getElementById('gProg').textContent=(st.i+1)+' / '+h.q.length;
 document.getElementById('gEmoji').textContent=q.e;
 document.getElementById('gText').textContent=q.t;
 document.getElementById('gHint').textContent=q.h||'';
 const b=document.getElementById('gBody');b.innerHTML='';
 document.getElementById('gFb').classList.remove('show','good','bad');
 document.getElementById('gFact').classList.remove('show');
 document.getElementById('btnNext').classList.remove('show');
 renderO(q,b);setTimeout(()=>say(q.t),350);}

function renderO(q,b){const w=document.createElement('div');w.className='opts';
 q.o.forEach(o=>{const e=document.createElement('button');e.className='opt';
  e.innerHTML='<span class="oe">'+o.e+'</span><span class="ot">'+o.t+'</span>';
  e.addEventListener('click',()=>pick(e,o,w,q));w.appendChild(e)});
 b.appendChild(w);}

function pick(btn,o,w,q){if(st.lock)return;st.lock=1;ea();
 const all=w.querySelectorAll('.opt');all.forEach(b=>b.classList.add('locked'));
 const fb=document.getElementById('gFb'),fe=document.getElementById('gFbEmoji'),
  ft=document.getElementById('gFbTitle'),fx=document.getElementById('gFbText');
 if(o.g){btn.classList.add('good');all.forEach(b=>{if(b!==btn)b.classList.add('dim')});
  addS(5);st.hs+=5;sx.good();sx.star();popM();fire(28,innerWidth/2,innerHeight*.4);
  fb.classList.add('show','good');fe.textContent='🏅';
  ft.textContent='Верно! +5 звёзд';fx.innerHTML=o.f;say('Верно! '+o.f);}
 else{btn.classList.add('bad');const g=q.o.find(x=>x.g);
  all.forEach(b=>{const t=b.querySelector('.ot').textContent;
   if(b!==btn&&g&&t===g.t)b.classList.add('good');else if(b!==btn)b.classList.add('dim')});
  sx.bad();fb.classList.add('show','bad');fe.textContent='💡';
  ft.textContent='Правильный ответ рядом';fx.innerHTML=o.f;
  say('Посмотри на правильный ответ. '+o.f);}
 const fact=FACTS[q.fk];
 if(fact){document.getElementById('gFactText').textContent=fact;
  document.getElementById('gFact').classList.add('show');
  setTimeout(()=>say(fact),2400);}
 document.getElementById('btnNext').textContent=(st.i<st.h.q.length-1)?'Дальше →':'Готово! →';
 document.getElementById('btnNext').classList.add('show');}

document.getElementById('btnNext').addEventListener('click',()=>{
 ea();sx.click();st.i++;
 if(st.i>=st.h.q.length)finishH();else renderT();});

/* ФИНАЛ ЗАЛА */
function finishH(){const h=st.h;st.done[h.id]=1;
 document.getElementById('lfBadge').innerHTML=badge(h.bg);
 document.getElementById('lfTitle').textContent='Зал «'+h.nm+'» пройден!';
 document.getElementById('lfText').textContent=
  (st.hs>=h.q.length*5)?'Все ответы верны! Настоящий спортсмен!':'Отлично! Ты стал ближе к значку ГТО.';
 document.getElementById('lfTokens').textContent=st.hs;
 show('scr-levelend');sx.fin();fire(60,innerWidth/2,innerHeight*.4);
 say('Ура! Зал пройден! Ты собрал '+st.hs+' звёзд.');
 if(Object.keys(st.done).length>=HALLS.length)setTimeout(showFinal,2800);}

/* ОБЩИЙ ФИНАЛ */
function showFinal(){const s=st.score;let b,r,wd;
 if(s>=90){b=badge('gold');r='🥇 Золотой значок ГТО';
  wd='Поздравляю! Ты прошёл все залы и показал отличные знания. Золотой значок — для самых сильных, быстрых и ловких. Ты настоящий чемпион!';}
 else if(s>=60){b=badge('silver');r='🥈 Серебряный значок ГТО';
  wd='Отличный результат! Ты много знаешь о спорте. Попробуй ещё раз — и получишь золото!';}
 else{b=badge('bronze');r='🥉 Бронзовый значок ГТО';
  wd='Хорошее начало! Ты узнал много нового о ГТО. Продолжай тренироваться и учиться!';}
 document.getElementById('finalBadge').innerHTML=b;
 document.getElementById('fRank').textContent=r;
 document.getElementById('fScore').textContent=s;
 document.getElementById('fWisdom').textContent=wd;
 show('scr-final');sx.fin();
 fire(120,innerWidth/2,innerHeight*.4);
 setTimeout(()=>fire(80,innerWidth*.3,innerHeight*.5),400);
 setTimeout(()=>fire(80,innerWidth*.7,innerHeight*.5),800);
 say('Поздравляю! '+wd);}

/* ЛОГИКА ФРАЗ ВЕДУЩЕГО */
function doneCount(){return Object.keys(st.done).length}

/* КНОПКИ */
document.getElementById('btnStart').addEventListener('click',()=>{
 ea();sx.click();renderMap();show('scr-map');startM();
 const d=doneCount();
 if(d===0)say('Добро пожаловать в спортивные залы ГТО! Начнём с самого первого зала — Скорость!');
 else if(d===1)say('Отлично! Теперь тебе открылся следующий зал. Выбирай, куда пойдём!');
 else say('Молодец! Выбирай следующий зал!');});
document.getElementById('btnBack').addEventListener('click',()=>{
 ea();sx.click();renderMap();show('scr-map');
 const d=doneCount();
 if(d===1)say('Теперь тебе открылся следующий зал. Выбирай!');
 else if(d<HALLS.length)say('Отлично! Выбирай следующий зал!');
 else say('Все залы пройдены! Молодец!');});
document.getElementById('btnRestart').addEventListener('click',()=>{
 ea();stopS();stopM();sx.click();st.score=0;st.done={};
 document.getElementById('score').textContent='0';show('scr-start');});
document.getElementById('menuBtn').addEventListener('click',()=>{
 ea();sx.click();renderMap();show('scr-map')});
document.getElementById('sound').addEventListener('click',()=>{
 st.sound=!st.sound;document.getElementById('sound').textContent=st.sound?'🔔':'🔕';
 if(!st.sound){stopS();stopM()}else{ea();sx.click();startM();say('Звук включён!')}});

/* ИНИЦИАЛИЗАЦИЯ */
document.getElementById('startBadge').innerHTML=badge('gold');
document.getElementById('finalBadge').innerHTML=badge('gold');
document.getElementById('lm').innerHTML=GTO_LOGO;
document.getElementById('startAuthor').innerHTML=SIGNAUTH;
document.getElementById('finalAuthor').innerHTML=SIGNAUTH;

document.addEventListener('pointerdown',function once(){ea();document.removeEventListener('pointerdown',once)},{once:true});
</script>
</body>
</html>
